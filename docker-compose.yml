version: '3.8'

services:
  # 1. Streamlit Web Dashboard (Port 8501)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: argus-eudr-auditor:latest
    container_name: argus-frontend
    ports:
      - "8501:8501"
    volumes:
      - ./:/data
    environment:
      - PYTHONUNBUFFERED=1
      - GDAL_DISABLE_READDIR_ON_OPEN=EMPTY_DIR
      - GDAL_HTTP_TIMEOUT=30
    command: ["serve-ui"]

  # 2. FastAPI REST API Engine (Port 8000)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: argus-eudr-auditor:latest
    container_name: argus-api
    ports:
      - "8000:8000"
    volumes:
      - ./:/data
    environment:
      - PYTHONUNBUFFERED=1
      - GDAL_DISABLE_READDIR_ON_OPEN=EMPTY_DIR
      - GDAL_HTTP_TIMEOUT=30
    command: ["serve-api"]

  # 3. Ad-hoc CLI Runner
  cli:
    build:
      context: .
      dockerfile: Dockerfile
    image: argus-eudr-auditor:latest
    volumes:
      - ./:/data
    environment:
      - PYTHONUNBUFFERED=1
      - GDAL_DISABLE_READDIR_ON_OPEN=EMPTY_DIR
      - GDAL_HTTP_TIMEOUT=30
